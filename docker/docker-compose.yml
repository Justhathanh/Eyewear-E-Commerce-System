version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: eyewear-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: eyewear_shop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: bash -c "docker-php-ext-install pdo pdo_mysql &&
      a2enmod rewrite &&
      sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
      apache2-foreground"
  php:
    image: php:8.2-apache
    container_name: eyewear-php
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - mysql
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"

volumes:
  mysql_data:
