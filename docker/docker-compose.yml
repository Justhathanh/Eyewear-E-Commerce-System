services:
  mysql:
    image: mysql:8.0
    container_name: eyewear-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: eyewear_shop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    image: php:8.2-apache
    container_name: eyewear-php
    ports:
      - "9090:80"
    volumes:
      - ../backend:/var/www/html/api
      - ../frontend/PHP:/var/www/html
      - ../frontend/assets:/var/www/html/assets
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql
      && a2enmod rewrite
      && sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf
      && apache2-foreground"

volumes:
  mysql_data: