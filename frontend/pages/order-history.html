<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch Sử Đơn Hàng – OpticStore</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f7f5f0;
        --surface: #ffffff;
        --border: #e2ddd4;
        --text-primary: #1a1714;
        --text-secondary: #6b6560;
        --text-muted: #9e9991;
        --accent: #2c5f8a;
        --accent-light: #ebf2f9;
        --success: #2e7d52;
        --success-light: #ebf5ef;
        --warning: #b45309;
        --warning-light: #fef3e2;
        --danger: #b91c1c;
        --danger-light: #fef2f2;
        --gray-light: #f4f2ed;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
      }

      /* ─── NAV ─── */
      nav {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .nav-logo {
        font-family: "DM Serif Display", serif;
        font-size: 1.4rem;
        color: var(--text-primary);
        text-decoration: none;
        letter-spacing: -0.02em;
      }
      .nav-logo span {
        color: var(--accent);
      }
      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }
      .nav-links a {
        font-size: 0.875rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--accent);
      }
      .nav-user {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .nav-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent-light);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 600;
      }

      /* ─── LAYOUT ─── */
      .page-wrapper {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem;
      }

      /* ─── HEADER ─── */
      .page-header {
        margin-bottom: 2rem;
      }
      .page-header h1 {
        font-family: "DM Serif Display", serif;
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.03em;
        margin-bottom: 0.25rem;
      }
      .page-header p {
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      /* ─── STATS ─── */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
      }
      .stat-label {
        font-size: 0.78rem;
        color: var(--text-muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.5rem;
      }
      .stat-value {
        font-size: 1.75rem;
        font-weight: 300;
        letter-spacing: -0.04em;
      }
      .stat-sub {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }

      /* ─── CONTROLS ─── */
      .controls {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-box {
        flex: 1;
        min-width: 200px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 0.6rem 1rem 0.6rem 2.5rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 0.875rem;
        background: var(--surface);
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.2s;
      }
      .search-box input:focus {
        border-color: var(--accent);
      }
      .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }
      .filter-select {
        padding: 0.6rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 0.875rem;
        background: var(--surface);
        color: var(--text-primary);
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .filter-select:focus {
        border-color: var(--accent);
      }

      /* ─── ORDERS ─── */
      .orders-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .order-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition:
          box-shadow 0.2s,
          transform 0.2s;
        animation: fadeUp 0.3s ease both;
      }
      .order-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .order-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
      }
      .order-header:hover {
        background: var(--gray-light);
      }

      .order-id {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      .order-date {
        font-size: 0.875rem;
        font-weight: 500;
      }

      .order-meta {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      .order-total {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      /* Status badge */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.3rem 0.75rem;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .badge-success {
        background: var(--success-light);
        color: var(--success);
      }
      .badge-success .badge-dot {
        background: var(--success);
      }
      .badge-warning {
        background: var(--warning-light);
        color: var(--warning);
      }
      .badge-warning .badge-dot {
        background: var(--warning);
      }
      .badge-danger {
        background: var(--danger-light);
        color: var(--danger);
      }
      .badge-danger .badge-dot {
        background: var(--danger);
      }
      .badge-accent {
        background: var(--accent-light);
        color: var(--accent);
      }
      .badge-accent .badge-dot {
        background: var(--accent);
      }
      .badge-gray {
        background: var(--gray-light);
        color: var(--text-secondary);
      }
      .badge-gray .badge-dot {
        background: var(--text-muted);
      }

      /* Chevron */
      .chevron {
        width: 20px;
        height: 20px;
        color: var(--text-muted);
        transition: transform 0.25s;
        flex-shrink: 0;
      }
      .order-card.open .chevron {
        transform: rotate(180deg);
      }

      /* ─── DETAIL ─── */
      .order-detail {
        display: none;
        padding: 1.25rem 1.5rem;
        border-top: 1px solid var(--border);
      }
      .order-card.open .order-detail {
        display: block;
      }

      .items-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }
      .items-table th {
        text-align: left;
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--border);
      }
      .items-table td {
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .items-table tr:last-child td {
        border-bottom: none;
      }
      .item-thumb {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-sm);
        background: var(--gray-light);
        object-fit: contain;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-right: 0.75rem;
        flex-shrink: 0;
      }
      .item-info {
        display: flex;
        align-items: center;
      }
      .item-name {
        font-weight: 500;
      }
      .item-variant {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .order-summary {
        display: flex;
        justify-content: space-between;
        gap: 2rem;
        margin-top: 0.5rem;
      }
      .order-address {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.7;
      }
      .order-address strong {
        color: var(--text-primary);
        font-weight: 500;
        display: block;
        margin-bottom: 0.25rem;
      }

      .totals {
        min-width: 220px;
      }
      .totals-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.875rem;
        padding: 0.3rem 0;
        color: var(--text-secondary);
      }
      .totals-row.grand {
        border-top: 1px solid var(--border);
        margin-top: 0.4rem;
        padding-top: 0.6rem;
        color: var(--text-primary);
        font-weight: 600;
        font-size: 1rem;
      }

      .detail-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }
      .btn {
        padding: 0.55rem 1.25rem;
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-primary);
        transition: all 0.15s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .btn:hover {
        background: var(--gray-light);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn-primary:hover {
        background: #1e4d75;
        border-color: #1e4d75;
      }

      /* ─── EMPTY / LOADING ─── */
      .state-empty,
      .state-loading,
      .state-error {
        text-align: center;
        padding: 4rem 2rem;
      }
      .state-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .state-title {
        font-size: 1.2rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .state-desc {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── PAGINATION ─── */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
      }
      .page-btn {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 0.875rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .page-btn:hover:not(:disabled) {
        background: var(--gray-light);
        color: var(--text-primary);
      }
      .page-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      @media (max-width: 640px) {
        .stats-row {
          grid-template-columns: 1fr;
        }
        .order-meta {
          flex-direction: column;
          align-items: flex-end;
          gap: 0.5rem;
        }
        .order-summary {
          flex-direction: column;
        }
        nav {
          padding: 0 1rem;
        }
        .nav-links {
          display: none;
        }
        .page-wrapper {
          padding: 1.5rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="nav-logo" href="#">Optic<span>Store</span></a>
      <ul class="nav-links">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Sản phẩm</a></li>
        <li><a href="#" class="active">Đơn hàng</a></li>
        <li><a href="#">Tài khoản</a></li>
      </ul>
      <div class="nav-user">
        <span style="font-size: 0.875rem; color: var(--text-secondary)"
          >Nguyễn Văn A</span
        >
        <div class="nav-avatar">NA</div>
      </div>
    </nav>

    <div class="page-wrapper">
      <div class="page-header">
        <h1>Lịch sử đơn hàng</h1>
        <p>Xem và quản lý tất cả đơn hàng của bạn</p>
      </div>

      <!-- Stats -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-label">Tổng đơn hàng</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Đã hoàn thành</div>
          <div class="stat-value" id="statDone">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tổng chi tiêu</div>
          <div class="stat-value" id="statSpend">—</div>
          <div class="stat-sub">VNĐ</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="search-box">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm theo mã đơn, sản phẩm…"
          />
        </div>
        <select class="filter-select" id="statusFilter">
          <option value="COMPLETED">Hoàn thành</option>
          <option value="SHIPPED">Đang giao</option>
          <option value="CONFIRMED">Đã xác nhận</option>
          <option value="PENDING">Chờ xử lý</option>
          <option value="CANCELLED">Đã hủy</option>
        </select>
        <select class="filter-select" id="sortFilter">
          <option value="newest">Mới nhất</option>
          <option value="oldest">Cũ nhất</option>
          <option value="highest">Giá cao nhất</option>
          <option value="lowest">Giá thấp nhất</option>
        </select>
      </div>

      <!-- Orders -->
      <div id="ordersContainer">
        <div class="state-loading">
          <div class="spinner"></div>
          <div class="state-title">Đang tải đơn hàng…</div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>

    <script src="order-history.js"></script>
  </body>
</html>
